name: neospike
version: 1.0.6
description: "Private local hybrid text memory with profile isolation."
requires_hermes: ">=0.23.3"
# standalone: general discovery also loads it (plugins.enabled), giving register() ctx.llm for the
# daily idle task; the memory loader still finds it as a provider.
kind: standalone
provides_hooks:
  - transform_llm_output
  - on_session_end
# onnxruntime: Windows takes the DirectML build (GPU when one works, otherwise CPU), other systems the CPU
# build. Both install the same module, so each system gets exactly one of the two lines.
python_dependencies:
  - "numpy>=2.0,<3"
  - "faiss-cpu>=1.16,<2"
  - "tokenizers>=0.22,<1"
  - "onnxruntime-directml>=1.20,<2; sys_platform == 'win32'"
  - "onnxruntime>=1.20,<2; sys_platform != 'win32'"
  - "huggingface-hub>=1.0,<2"
